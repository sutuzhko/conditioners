# Наложение для локального прогона боевого состава перед запуском.
#
# 🔴 Зачем оно вообще есть. Боевой состав нельзя проверить в деве: standalone-
# рантайм, healthcheck'и, права тома загрузок, отдельный сервис `migrate` и
# сигналы воркеру живут только в нём. Прогон «на живую» до покупки VPS —
# единственный способ увидеть их работающими (issue #114, #62).
#
# Меняется ровно одно и по одной причине: боевой `db` публикует порт на
# 127.0.0.1:5432, а на машине разработчика там уже стоит дев-база. Всё
# остальное — образы, лимиты памяти, healthcheck'и, порядок запуска, тома —
# берётся из боевого файла без правок: подменять их значило бы проверять не то.
#
# Домен для прогона — `tulaklimat.localhost`. Caddy выдаёт таким именам
# собственный сертификат, не ходя в Let's Encrypt, и цепочка проверяется
# целиком: TLS → прокси → приложение, с настоящим `Secure` у cookie сессии
# (ADR-102). Боевой Caddyfile при этом не подменяется.
#
# Запуск:
#   docker compose --env-file .env.prod \
#     -f docker-compose.prod.yml -f docker-compose.prod.local.yml <команда>

services:
  db:
    # `!override`, а не просто список: без него compose **складывает** порты, и
    # база пытается занять оба — включая тот самый 5432, из-за которого
    # наложение и заведено.
    ports: !override
      - '127.0.0.1:15432:5432'
