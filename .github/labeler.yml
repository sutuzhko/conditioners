# Карта «путь → ярлык» для actions/labeler.
#
# 🔴 Файл собирается из scripts/labels.mjs командой
#    node scripts/labeler-generate.mjs --write
# Правки руками теряются при следующей сборке; тест сверяет файл с
# генерацией и краснеет на расхождении.
'area/site':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/web/src/app/(site)/**'

'area/panel':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/web/src/app/(admin)/**'
          - 'apps/web/src/widgets/admin-*/**'

'area/api':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/web/src/app/api/**'
          - 'apps/web/src/server/**'
          - 'apps/web/prisma/**'

'area/infra':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - 'scripts/**'
          - 'infra/**'
          - 'apps/web/e2e/**'
          - 'docker-compose*.yml'

'area/process':
  - changed-files:
      - any-glob-to-any-file:
          - '.agents/skills/**'
          - '.husky/**'

'area/shared':
  - changed-files:
