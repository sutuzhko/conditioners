# Пересчёт эталонов снимков историй — issue #238.
#
# 🔴 Пересчитать эталоны с хоста нельзя: они сняты в дев-образе и лежат под
# именами `*-linux.png` (ADR-168). Шрифты на macOS рисуются иначе, и снимок с
# машины разработчика не сойдётся с эталоном ни разу.
#
# Локально это означало пятнадцать минут высокой нагрузки на машине, которая
# полный состав Docker и не тянет (ADR-173). Правка вёрстки при этом задевает
# эталоны десятками — одна правка карточки товара меняет до 280 снимков, — и
# выбор у разработчика оставался между «не править вёрстку» и «оставить VR
# красным». Красный VR перестают читать, это уже проходили.
name: Эталоны снимков

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Ветка, в которой пересчитать эталоны
        required: true
        type: string
      issue:
        description: Номер issue для тела коммита (необязательно)
        required: false
        type: string

# Пересчёт пишет в ветку. Два одновременных запуска по одной ветке
# гарантированно поссорятся на push, поэтому второй ждёт первого.
concurrency:
  group: vr-baselines-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Значения только для сборки историй: данных из базы они не читают, но
      # схема окружения обязана сойтись — её тянут импорты компонентов.
      DATABASE_URL: postgresql://tk:ci@127.0.0.1:5432/tulaklimat?schema=public
      SITE_URL: https://ci.invalid
      SESSION_SECRET: ci-secret-not-used-anywhere
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          # Полная история: без неё `merge-base` не на чем считать —
          # `actions/checkout` по умолчанию берёт один коммит.
          fetch-depth: 0

      # 🔴 Пересчёт на ветке, отставшей от `main`, записывает в репозиторий
      # вёрстку, которой больше нет, — и делает это молча, зелёным прогоном и
      # осмысленным коммитом. Тридцатого августа так завелись эталоны историй
      # `блоки-отзывы--drifting` и `--paused`: ветка не содержала переписанной
      # кнопки (ADR-181), и в эталон попала рамка `--line-strong`, которой в
      # коде уже не было. Дальше восемь снимков падали на одних ветках и
      # проходили на других, и полтора дня это читали как дрожание пайплайна
      # (issue #424, ADR-216).
      #
      # Отказ идёт до сборки образа: полчаса прогона и порча эталонов стоят
      # дороже, чем отказ на первой минуте.
      - name: Ветка содержит main
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Ветка ${{ inputs.branch }} содержит main — пересчёт разрешён."
            exit 0
          fi
          echo "::error::Ветка ${{ inputs.branch }} отстала от main."
          echo "Пересчёт на ней запишет эталоны той вёрстки, которой в main уже нет."
          echo "Влейте main в ветку и запустите пересчёт заново."
          exit 1

      # 🔴 Тем же образом и тем же способом, что задание `vr` в ci.yml. Любое
      # расхождение здесь бессмысленно вдвойне: эталоны разъедутся не с кодом,
      # а с той проверкой, ради которой их и снимают.
      - name: Дев-образ
        run: docker build --target dev -t tulaklimat-dev:ci .

      - name: Витрина под снимки
        run: |
          docker network create vr
          docker run -d --name vr-storybook --network vr --network-alias storybook \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web storybook

          # Готовность — по индексу историй, а не по открытому порту: порт
          # слушается раньше, чем Vite соберёт истории, и первый снимок вышел бы
          # пустым, а не упавшим
          docker exec vr-storybook node -e "
            (async () => {
              for (let i = 0; i < 90; i += 1) {
                try {
                  const r = await fetch('http://localhost:6006/index.json');
                  if (r.ok) { console.log('витрина готова'); return; }
                } catch {}
                await new Promise((done) => setTimeout(done, 2000));
              }
              console.error('витрина не поднялась за три минуты');
              process.exit(1);
            })()"

      # Прогон заведомо «падает»: с --update-snapshots Playwright сообщает о
      # каждом перезаписанном эталоне ненулевым кодом. Интересен здесь не код,
      # а то, что окажется в каталоге эталонов.
      - name: Пересчёт эталонов
        run: |
          docker run --name vr-update --network vr \
            -e VR_BASE_URL=http://storybook:6006 \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web vr --update-snapshots || true

      - name: Забрать эталоны из контейнера
        run: |
          docker cp vr-update:/app/apps/web/e2e/vr/. ./apps/web/e2e/vr/

      - name: Журнал витрины
        if: failure()
        run: docker logs vr-storybook | tail -50

      # 🔴 Автор — тот, кто запустил задание. Эталоны пересчитываются по
      # решению человека, и в истории стоит его имя, а не имя робота.
      - name: Коммит и пуш
        run: |
          # Через status, а не diff: у новой истории эталон появляется новым
          # файлом, а неотслеживаемое `git diff` не видит вовсе.
          if [ -z "$(git status --porcelain -- apps/web/e2e/vr)" ]; then
            echo "Эталоны не изменились — коммитить нечего."
            exit 0
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          git add apps/web/e2e/vr
          count=$(git diff --cached --name-only -- apps/web/e2e/vr | wc -l | tr -d ' ')
          {
            echo "test(ui): пересчитывает эталоны снимков историй"
            echo
            echo "Правка вёрстки сдвинула $count снимков. Пересчёт сделан в дев-образе"
            echo "заданием пайплайна: с macOS эталоны не снимаются — там другие"
            echo "шрифты, и снимок не сходится с эталоном ни разу (ADR-168)."
            if [ -n "${{ inputs.issue }}" ]; then
              echo
              echo "Часть #${{ inputs.issue }}"
            fi
          } > /tmp/vr-message

          git commit -F /tmp/vr-message
          git push origin HEAD:"${{ inputs.branch }}"
