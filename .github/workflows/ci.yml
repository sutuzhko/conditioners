name: CI

# Что проверяем на каждый пуш: линт, стили, типы, тесты и — обязательно —
# что боевой образ вообще собирается. Сломанная сборка, найденная при выкладке,
# стоит простоя сайта; найденная здесь — ничего.
on:
  push:
    branches: [main]
  pull_request:

# 🔴 Отмена только на ветках, но не на `main` — и добивается этого **группа**,
# а не выражение в `cancel-in-progress`.
#
# `cancel-in-progress: true` для всего означало, что каждый merge отменяет
# прогон предыдущего: в очереди из шести merge'ей подряд пять коммитов `main`
# остались без вердикта вовсе. Снаружи отменённый прогон неотличим от упавшего,
# и вывод «CI опять красный» совершенно естественен.
#
# Первая починка (#206) выключала отмену выражением
# `${{ github.ref != 'refs/heads/main' }}` — и не сработала: прогоны `main`
# продолжали умирать за четырнадцать секунд, не начав ни одного задания
# (issue #293). Поэтому теперь у каждого коммита `main` **своя группа**:
# отменять нечего по построению, а не по вычислению условия.
#
# На ветке группа общая на ref, и новый push по-прежнему отменяет заведомо
# устаревшую проверку — там это правильно.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tk
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tulaklimat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tk -d tulaklimat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Значения только для проверки: настоящие живут в .env.prod на сервере
      DATABASE_URL: postgresql://tk:ci@127.0.0.1:5432/tulaklimat?schema=public
      SITE_URL: https://ci.invalid
      SESSION_SECRET: ci-secret-not-used-anywhere
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm из package.json
        run: corepack enable

      - name: Кеш store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec prisma generate

      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm typecheck
      - run: pnpm test

      # 🔴 Витрина компонентов обязана собираться. Историй больше сотни, и до
      # этого шага сломанная не роняла ничего: поломка обнаруживалась ручным
      # запуском Storybook, то есть когда-нибудь. Сборка ловит несобираемое —
      # пропавший экспорт, битый импорт, ошибку типов в истории; поломку в
      # отрисовке ловят снимки историй, это соседняя задача.
      - name: Витрина компонентов
        run: pnpm --filter web build-storybook --quiet

      # Схема нужна до сборки: главная и статьи пререндерятся с данными,
      # и `next build` ходит в базу (ADR-062)
      - name: Миграции
        run: pnpm --filter web exec prisma migrate deploy

      # Собираем именно боевой образ, а не `next build` на голой машине:
      # так проверяется ещё и Dockerfile, из которого едет прод
      - name: Боевой образ
        run: |
          docker build --network=host --target runner \
            --build-arg DATABASE_URL="$DATABASE_URL" \
            --build-arg SITE_URL="$SITE_URL" \
            -t tulaklimat-web:ci .

      # Бюджет считается по манифестам той же сборки: стадия `build` уже в
      # кеше предыдущего шага, второй компиляции не происходит (ADR-088)
      - name: Бюджет JS
        run: |
          docker build --network=host --target build \
            --build-arg DATABASE_URL="$DATABASE_URL" \
            --build-arg SITE_URL="$SITE_URL" \
            -t tulaklimat-build:ci .
          id=$(docker create tulaklimat-build:ci)
          docker cp "$id:/app/apps/web/.next" ./next-build
          docker rm "$id"
          node scripts/js-budget.mjs ./next-build --strict

  # 🔴 Снимки историй — отдельной работой, а не шагом в `check`.
  #
  # Прогон идёт около получаса: 171 история на четырёх ширинах в двух темах,
  # воркер один. Шагом внутри `check` он растянул бы на полчаса и вердикт по
  # линту с типами — а дешёвая проверка обязана отвечать первой. Отдельной
  # работой её ответ приходит через несколько минут и не ждёт снимков.
  #
  # `needs: check` — сознательно: гонять полчаса снимки при красных типах значит
  # жечь минуты раннера ради заведомо бесполезного вердикта.
  vr:
    runs-on: ubuntu-latest
    # Красный VR при красных типах — шум: сначала пусть починят то, что дешевле
    needs: check

    env:
      # Значения только для проверки: истории данных из базы не читают, но
      # схема окружения обязана сойтись — её тянут импорты компонентов
      DATABASE_URL: postgresql://tk:ci@127.0.0.1:5432/tulaklimat?schema=public
      SITE_URL: https://ci.invalid
      SESSION_SECRET: ci-secret-not-used-anywhere
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      # 🔴 Снимки не переснимаются там, где пиксели измениться не могли
      # (ADR-221). Работа идёт 18 минут на 1504 кадрах, и после включения
      # защиты `main` её ждёт каждый PR — включая правку одной строки в
      # документации. Проверка при этом остаётся обязательной: работа не
      # пропускается, а заканчивается за секунды с зелёным вердиктом.
      #
      # Список путей — то, что физически способно сдвинуть кадр: исходники,
      # настройка витрины, сам раннер, зависимости, образ и этот файл. Всё
      # остальное — документация, задания выкладки, журналы — кадр не двигает.
      - name: Затрагивает ли правка пиксели
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Не pull request — снимаем всё."
            echo "pixels=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          if printf '%s\n' "$changed" | grep -qE '^(apps/web/src/|apps/web/\.storybook/|apps/web/e2e/vr/|apps/web/playwright\.vr\.config\.ts|apps/web/package\.json|pnpm-lock\.yaml|Dockerfile|\.github/workflows/ci\.yml)'; then
            echo "pixels=true" >> "$GITHUB_OUTPUT"
          else
            echo "pixels=false" >> "$GITHUB_OUTPUT"
            echo "Пиксели не задеты, снимки пропускаются. Изменено:"
            printf '  %s\n' $changed
          fi

      # 🔴 Тем же образом, которым сняты эталоны (ADR-168). Шрифты на
      # ubuntu-раннере и в alpine-образе отрисовываются по-разному, и снимок,
      # снятый мимо образа, не совпадёт с эталоном ни разу — красный VR стал бы
      # фоновым шумом, каким три дня был красный пайплайн (ADR-167).
      - name: Дев-образ
        if: steps.scope.outputs.pixels == 'true'
        run: docker build --target dev -t tulaklimat-dev:ci .

      - name: Витрина под снимки
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker network create vr
          docker run -d --name vr-storybook --network vr --network-alias storybook \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web storybook

          # Готовность — по индексу историй, а не по открытому порту: порт
          # слушается раньше, чем Vite соберёт истории, и первый снимок вышел бы
          # пустым, а не упавшим
          docker exec vr-storybook node -e "
            (async () => {
              for (let i = 0; i < 90; i += 1) {
                try {
                  const r = await fetch('http://localhost:6006/index.json');
                  if (r.ok) { console.log('витрина готова'); return; }
                } catch {}
                await new Promise((done) => setTimeout(done, 2000));
              }
              console.error('витрина не поднялась за три минуты');
              process.exit(1);
            })()"

      - name: Снимки историй
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker run --name vr-run --network vr \
            -e VR_BASE_URL=http://storybook:6006 \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web vr

      # Разницу видно только глазами: без картинок «снимок не совпал» не
      # говорит, уехала кнопка на пиксель или пропал целый блок
      - name: Расхождения снимков
        if: failure() && steps.scope.outputs.pixels == 'true'
        run: docker cp vr-run:/app/apps/web/test-results ./vr-results || true

      - uses: actions/upload-artifact@v4
        if: failure() && steps.scope.outputs.pixels == 'true'
        with:
          name: vr-diff
          path: vr-results
          retention-days: 7

      - name: Журнал витрины
        if: failure() && steps.scope.outputs.pixels == 'true'
        run: docker logs vr-storybook | tail -50

  # 🔴 Панель снимается своей работой, а не разделами в работе `vr` (issue #404).
  #
  # Ширины у неё свои: оболочка переключается по порогам 900 и 1200 и живёт на
  # 390 / 768 / 1440, а высоты контролов растут по кадру ниже 900 (ADR-183).
  # На публичных 375 и 1200 не проверяется ни телефонная раскладка, ни
  # десктопная, ни граница 900.
  #
  # Объём назван числом, а не прикинут: публичный прогон идёт 24 минуты на 1504
  # снимках — около секунды на снимок. Кит панели даёт 302 истории × 3 ширины ×
  # 2 темы = 1812 снимков, то есть примерно полчаса. Отдельной работой они идут
  # параллельно публичным, и общее время пайплайна не растёт.
  #
  # Снимается кит, а не разделы: истории кита несут свои данные в файле, а
  # разделы `Админка/` рисуются из БД и без фикстур меняются от её содержимого.
  vr-panel:
    runs-on: ubuntu-latest
    needs: check

    env:
      DATABASE_URL: postgresql://tk:ci@127.0.0.1:5432/tulaklimat?schema=public
      SITE_URL: https://ci.invalid
      SESSION_SECRET: ci-secret-not-used-anywhere
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      # 🔴 Снимки не переснимаются там, где пиксели измениться не могли
      # (ADR-221). Работа идёт 18 минут на 1504 кадрах, и после включения
      # защиты `main` её ждёт каждый PR — включая правку одной строки в
      # документации. Проверка при этом остаётся обязательной: работа не
      # пропускается, а заканчивается за секунды с зелёным вердиктом.
      #
      # Список путей — то, что физически способно сдвинуть кадр: исходники,
      # настройка витрины, сам раннер, зависимости, образ и этот файл. Всё
      # остальное — документация, задания выкладки, журналы — кадр не двигает.
      - name: Затрагивает ли правка пиксели
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Не pull request — снимаем всё."
            echo "pixels=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          if printf '%s\n' "$changed" | grep -qE '^(apps/web/src/|apps/web/\.storybook/|apps/web/e2e/vr/|apps/web/playwright\.vr\.config\.ts|apps/web/package\.json|pnpm-lock\.yaml|Dockerfile|\.github/workflows/ci\.yml)'; then
            echo "pixels=true" >> "$GITHUB_OUTPUT"
          else
            echo "pixels=false" >> "$GITHUB_OUTPUT"
            echo "Пиксели не задеты, снимки пропускаются. Изменено:"
            printf '  %s\n' $changed
          fi

      - name: Дев-образ
        if: steps.scope.outputs.pixels == 'true'
        run: docker build --target dev -t tulaklimat-dev:ci .

      - name: Витрина под снимки
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker network create vr-panel
          docker run -d --name vr-panel-storybook --network vr-panel --network-alias storybook \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web storybook

          docker exec vr-panel-storybook node -e "
            (async () => {
              for (let i = 0; i < 90; i += 1) {
                try {
                  const r = await fetch('http://localhost:6006/index.json');
                  if (r.ok) { console.log('витрина готова'); return; }
                } catch {}
                await new Promise((done) => setTimeout(done, 2000));
              }
              console.error('витрина не поднялась за три минуты');
              process.exit(1);
            })()"

      - name: Снимки кита панели
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker run --name vr-panel-run --network vr-panel \
            -e VR_BASE_URL=http://storybook:6006 \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web vr:panel

      - name: Расхождения снимков
        if: failure() && steps.scope.outputs.pixels == 'true'
        run: docker cp vr-panel-run:/app/apps/web/test-results ./vr-panel-results || true

      - uses: actions/upload-artifact@v4
        if: failure() && steps.scope.outputs.pixels == 'true'
        with:
          name: vr-panel-diff
          path: vr-panel-results
          retention-days: 7

      - name: Журнал витрины
        if: failure() && steps.scope.outputs.pixels == 'true'
        run: docker logs vr-panel-storybook | tail -50

  # 🔴 Сквозные сценарии — три из них перечислены в CLAUDE.md как обязательные:
  # заявка доходит до базы, отзыв доезжает до модерации, правка цены видна на
  # сайте. До этой работы их не гонял никто: 971 строка сценариев лежала в
  # репозитории и не запускалась ни разу за прогон.
  #
  # Полторы минуты на оба профиля — это шаг, а не повод для отдельной долгой
  # работы. Но идёт он в дев-образе, а не на голом раннере: там уже стоит
  # системный chromium и задан CHROMIUM_PATH (ADR-021), а ставить браузеры
  # заново — минуты на каждый прогон.
  e2e:
    runs-on: ubuntu-latest
    needs: check

    env:
      # 🔴 Адрес тот же, по которому сценарии стучатся в приложение: из него
      # собираются канонические ссылки и карта сайта, и расхождение дало бы
      # падение не по делу. Схема http сознательно: на ней cookie сессии идёт
      # без флага Secure, иначе браузер её выбросит и вход не сработает
      # (ADR-102).
      SITE_URL: http://web:3000
      SESSION_SECRET: ci-secret-not-used-anywhere
      NEXT_TELEMETRY_DISABLED: '1'
      ADMIN_LOGIN: admin

    steps:
      - uses: actions/checkout@v4

      - name: Дев-образ
        if: steps.scope.outputs.pixels == 'true'
        run: docker build --target dev -t tulaklimat-dev:ci .

      - name: База под сценарии
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker network create e2e
          docker run -d --name e2e-db --network e2e --network-alias db \
            -e POSTGRES_USER=tk -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=tulaklimat \
            postgres:16-alpine

          # готовность — по pg_isready, а не по паузе: контейнер слушает порт
          # раньше, чем база принимает подключения
          for i in $(seq 1 60); do
            docker exec e2e-db pg_isready -U tk -d tulaklimat >/dev/null 2>&1 && break
            sleep 2
          done

      # 🔴 Сид обязателен, и это не украшение. Без него в базе нет ни
      # администратора, ни ставок допработ, ни группы настроек `legal` — три
      # сценария из пяти падают на первом же шаге. Хеш пароля считается здесь, а
      # не лежит в файле: пароль тестовый, но хешу в репозитории не место.
      - name: Схема и наполнение
        if: steps.scope.outputs.pixels == 'true'
        run: |
          # каталог приложения: пакет argon2 живёт в apps/web/node_modules,
          # из корня воркспейса он не разрешается
          hash=$(docker run --rm -w /app/apps/web tulaklimat-dev:ci \
            node -e "require('@node-rs/argon2').hash('admin').then((h) => process.stdout.write(h))")

          docker run --rm --network e2e -e DATABASE_URL="$DB_URL" \
            -e SITE_URL -e SESSION_SECRET tulaklimat-dev:ci \
            pnpm --filter web exec prisma migrate deploy

          docker run --rm --network e2e -e DATABASE_URL="$DB_URL" \
            -e SITE_URL -e SESSION_SECRET -e ADMIN_LOGIN \
            -e ADMIN_PASSWORD_HASH="$hash" tulaklimat-dev:ci \
            pnpm --filter web seed

          # 🔴 Демо-сид обязателен, и порядок тот же, что в DEPLOY §2. Базовый
          # сид оставляет настройки компании заполненными заглушками, а при
          # незаполненных настройках публичная часть отдаёт `noindex` и карта
          # сайта пуста (ADR-153) — сценарий «карта содержит существующие
          # адреса» падал на пустом `<urlset>`. Предохранитель демо-сида на
          # хост `db` не срабатывает: он считает боевыми только внешние адреса.
          docker run --rm --network e2e -e DATABASE_URL="$DB_URL" \
            -e SITE_URL -e SESSION_SECRET tulaklimat-dev:ci \
            pnpm --filter web seed:demo
        env:
          DB_URL: postgresql://tk:ci@db:5432/tulaklimat?schema=public

      - name: Приложение под сценарии
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker run -d --name e2e-web --network e2e --network-alias web \
            -e DATABASE_URL="$DB_URL" -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web dev

          # готовность — по ответу самой страницы: порт слушается раньше, чем
          # Next соберёт первую страницу, и первый же сценарий упал бы на пустом
          docker exec e2e-web node -e "
            (async () => {
              for (let i = 0; i < 90; i += 1) {
                try {
                  const r = await fetch('http://localhost:3000/');
                  if (r.ok) { console.log('приложение готово'); return; }
                } catch {}
                await new Promise((done) => setTimeout(done, 2000));
              }
              console.error('приложение не поднялось за три минуты');
              process.exit(1);
            })()"
        env:
          DB_URL: postgresql://tk:ci@db:5432/tulaklimat?schema=public

      - name: Сквозные сценарии
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker run --name e2e-run --network e2e \
            -e DATABASE_URL="$DB_URL" -e SITE_URL -e SESSION_SECRET \
            -e E2E_BASE_URL=http://web:3000 \
            -e E2E_ADMIN_LOGIN=admin -e E2E_ADMIN_PASSWORD=admin \
            -e CI=1 tulaklimat-dev:ci pnpm --filter web e2e
        env:
          DB_URL: postgresql://tk:ci@db:5432/tulaklimat?schema=public

      # Трассы Playwright уже пишутся при первом ретрае: без них «сценарий
      # упал» не говорит, на каком шаге и что было на экране
      - name: Трассы упавших сценариев
        if: failure() && steps.scope.outputs.pixels == 'true'
        run: docker cp e2e-run:/app/apps/web/test-results ./e2e-results || true

      - uses: actions/upload-artifact@v4
        if: failure() && steps.scope.outputs.pixels == 'true'
        with:
          name: e2e-trace
          path: e2e-results
          retention-days: 7

      - name: Журнал приложения
        if: failure() && steps.scope.outputs.pixels == 'true'
        run: docker logs e2e-web | tail -80
