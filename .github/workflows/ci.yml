name: CI

# Что проверяем на каждый пуш: линт, стили, типы, тесты и — обязательно —
# что боевой образ вообще собирается. Сломанная сборка, найденная при выкладке,
# стоит простоя сайта; найденная здесь — ничего.
on:
  push:
    branches: [main]
  # 🔴 Ярлык на PR сам проверок не перезапускает — поэтому работа слушает
  # `labeled` и `unlabeled`: так автор принимает разошедшиеся кадры ярлыком
  # `vr:accepted` (ADR-230), и вердикт пересчитывается без пустого коммита.
  # Перезапускаются все работы, а не только снимки: пропущенная работа и
  # зелёная считаются защитой `main` по-разному (ADR-221), а минуты бесплатны.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# 🔴 Отмена только на ветках, но не на `main` — и добивается этого **группа**,
# а не выражение в `cancel-in-progress`.
#
# `cancel-in-progress: true` для всего означало, что каждый merge отменяет
# прогон предыдущего: в очереди из шести merge'ей подряд пять коммитов `main`
# остались без вердикта вовсе. Снаружи отменённый прогон неотличим от упавшего,
# и вывод «CI опять красный» совершенно естественен.
#
# Первая починка (#206) выключала отмену выражением
# `${{ github.ref != 'refs/heads/main' }}` — и не сработала: прогоны `main`
# продолжали умирать за четырнадцать секунд, не начав ни одного задания
# (issue #293). Поэтому теперь у каждого коммита `main` **своя группа**:
# отменять нечего по построению, а не по вычислению условия.
#
# На ветке группа общая на ref, и новый push по-прежнему отменяет заведомо
# устаревшую проверку — там это правильно.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tk
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tulaklimat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tk -d tulaklimat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Значения только для проверки: настоящие живут в .env.prod на сервере
      DATABASE_URL: postgresql://tk:ci@127.0.0.1:5432/tulaklimat?schema=public
      SITE_URL: https://ci.invalid
      SESSION_SECRET: ci-secret-not-used-anywhere
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm из package.json
        run: corepack enable

      - name: Кеш store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec prisma generate

      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm typecheck
      - run: pnpm test

      # 🔴 Витрина компонентов обязана собираться. Историй больше сотни, и до
      # этого шага сломанная не роняла ничего: поломка обнаруживалась ручным
      # запуском Storybook, то есть когда-нибудь. Сборка ловит несобираемое —
      # пропавший экспорт, битый импорт, ошибку типов в истории; поломку в
      # отрисовке ловят снимки историй, это соседняя задача.
      - name: Витрина компонентов
        run: pnpm --filter web build-storybook --quiet

      # Схема нужна до сборки: главная и статьи пререндерятся с данными,
      # и `next build` ходит в базу (ADR-062)
      - name: Миграции
        run: pnpm --filter web exec prisma migrate deploy

      # Собираем именно боевой образ, а не `next build` на голой машине:
      # так проверяется ещё и Dockerfile, из которого едет прод
      - name: Боевой образ
        run: |
          docker build --network=host --target runner \
            --build-arg DATABASE_URL="$DATABASE_URL" \
            --build-arg SITE_URL="$SITE_URL" \
            -t tulaklimat-web:ci .

      # Бюджет считается по манифестам той же сборки: стадия `build` уже в
      # кеше предыдущего шага, второй компиляции не происходит (ADR-088)
      - name: Бюджет JS
        run: |
          docker build --network=host --target build \
            --build-arg DATABASE_URL="$DATABASE_URL" \
            --build-arg SITE_URL="$SITE_URL" \
            -t tulaklimat-build:ci .
          id=$(docker create tulaklimat-build:ci)
          docker cp "$id:/app/apps/web/.next" ./next-build
          docker rm "$id"
          node scripts/js-budget.mjs ./next-build --strict

  # 🔴 Снимки историй — отдельными работами, а не шагом в `check`.
  #
  # Дешёвая проверка обязана отвечать первой: линт и типы не ждут кадров.
  # `needs: check` снят (ADR-222): он экономил минуты раннера при красных
  # типах, но раннер здесь бесплатный — репозиторий публичный, — а платил за
  # эту экономию каждый зелёный прогон.
  #
  # 🔴 Кадры идут четырьмя шардами (ADR-231). Одним куском публичные кадры
  # снимались 4:07, кита панели — 6:30; бюджет фазы — критический путь снимков
  # не длиннее пяти минут при попадании в кеш, и делить дальше почти нечего:
  # ниже долей лежит накладная цена самого шарда — чекаут, образ, сборка
  # витрины.
  #
  # 🔴 Принадлежность истории доле считает раннер устойчивым хешем id
  # (`VR_SHARD=k/4`), а не порядковым номером в списке. Порядковый номер
  # переезжает при любом изменении состава историй — и кадр базы оказывался бы
  # в кеше чужого шарда, а история ложно становилась «новой». Хеш id один и
  # тот же у базы и ветки при любом составе.
  vr-shard:
    runs-on: ubuntu-latest

    # 🔴 Упавший шард не отменяет соседние: сводному вердикту нужны итоги всех
    # долей — иначе «итогов меньше ожидаемого» прячет настоящую причину.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      # Значения только для проверки: истории данных из базы не читают, но
      # схема окружения обязана сойтись — её тянут импорты компонентов
      DATABASE_URL: postgresql://tk:ci@127.0.0.1:5432/tulaklimat?schema=public
      SITE_URL: https://ci.invalid
      SESSION_SECRET: ci-secret-not-used-anywhere
      NEXT_TELEMETRY_DISABLED: '1'
      # 🔴 Всё, чем эта работа отличается от соседней, — здесь. Шаги ниже у
      # шардов public и panel одинаковы текстом, и расхождение между работами
      # видно диффом, а не вычитыванием: две копии одной последовательности в
      # проекте уже разъезжались (комментарий в e2e/vr/story-ready.ts).
      VR_PROJECT: public
      VR_SCRIPT: vr
      VR_NET: vr
      VR_ARTIFACT: vr-diff

    steps:
      # Глубина два: второй коммит — первый родитель merge-коммита PR, то есть
      # вершина `main`, в которую он вливается. Это и есть база сравнения.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 🔴 Снимки не переснимаются там, где пиксели измениться не могли
      # (ADR-221). После включения защиты `main` работу ждёт каждый PR —
      # включая правку одной строки в документации. Проверка при этом остаётся
      # обязательной: работа не пропускается, а заканчивается за секунды с
      # зелёным вердиктом.
      #
      # Список путей — то, что физически способно сдвинуть кадр или вердикт:
      # исходники, настройка витрины, сам раннер, сводка, зависимости, образ и
      # этот файл. Всё остальное — документация, задания выкладки, журналы —
      # кадр не двигает.
      - name: Затрагивает ли правка пиксели
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Не pull request — снимаем всё."
            echo "pixels=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          if printf '%s\n' "$changed" | grep -qE '^(apps/web/src/|apps/web/\.storybook/|apps/web/e2e/vr/|apps/web/playwright\.vr\.config\.ts|apps/web/package\.json|pnpm-lock\.yaml|Dockerfile|scripts/vr-summary\.mjs|\.github/workflows/ci\.yml)'; then
            echo "pixels=true" >> "$GITHUB_OUTPUT"
          else
            echo "pixels=false" >> "$GITHUB_OUTPUT"
            echo "Пиксели не задеты, снимки пропускаются. Изменено:"
            printf '  %s\n' $changed
          fi

          # Список изменённых файлов — раннеру (#444): он снимает только истории,
          # до которых правка дотягивается по графу импортов. Многострочный выход
          # — через ограничитель, иначе первая же вторая строка ломает файл выходов.
          {
            echo "changed<<VR_CHANGED_EOF"
            printf '%s\n' "$changed"
            echo "VR_CHANGED_EOF"
          } >> "$GITHUB_OUTPUT"

      # 🔴 Эталон кадра — кадр базы сравнения, снятый в этой же работе тем же
      # образом и тем же раннером (ADR-230). В репозитории эталонов нет. На PR
      # база — вершина `main`, в которую он вливается: первый родитель
      # merge-коммита, а не `pull_request.base.sha` — тот снят в момент события
      # и бывает устаревшим. На `main` сравнивать нечего: работа записывает
      # кадры в кеш для следующих PR.
      #
      # Ключ кеша — доля, база и версия отрисовщика: образ, зависимости,
      # конфигурация и код раннера — то, что меняет кадры при неизменной
      # витрине. Доля в ключе обязательна: у каждого шарда свои кадры, и общий
      # ключ подсунул бы кадры чужой доли. Настройка витрины (`.storybook/`) в
      # ключ не входит намеренно: её правка — настоящее визуальное изменение,
      # оно должно быть видно в сравнении, а не обходить кеш.
      - name: База сравнения
        id: base
        if: steps.scope.outputs.pixels == 'true'
        env:
          VR_CHANGED: ${{ steps.scope.outputs.changed }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mode=compare
            base=$(git rev-parse HEAD^1)
          else
            mode=record
            base=${{ github.sha }}
          fi
          renderer=${{ hashFiles('Dockerfile', 'pnpm-lock.yaml', 'apps/web/playwright.vr.config.ts', 'apps/web/e2e/vr/**/*.ts') }}
          # 🔴 Полный набор кадров и частичный — разные ключи (#444). `main`
          # пишет полный набор (`-full`); PR при промахе снимает базу только для
          # задетых историй и пишет частичный (`-aff-<хеш списка изменённого>`).
          # Выдай частичный за полный — следующий PR с другим списком не нашёл бы
          # кадров базы для своих историй и получил бы ложные «новые». Восстановление
          # в PR: сначала свой частичный, иначе полный с `main` (`restore-keys`).
          stem="vr-frames-$VR_PROJECT-s${{ matrix.shard }}of4-$base-$renderer"
          if [ "$mode" = "record" ]; then
            key="$stem-full"
            restore=""
          else
            aff=$(printf '%s\n' "$VR_CHANGED" | sha1sum | cut -c1-12)
            key="$stem-aff-$aff"
            restore="$stem-full"
          fi
          {
            echo "mode=$mode"
            echo "base=$base"
            echo "key=$key"
            echo "restore=$restore"
          } >> "$GITHUB_OUTPUT"
          echo "Режим: $mode, база: $base, доля: ${{ matrix.shard }}/4, ключ: $key"
          mkdir -p vr-frames vr-outcome vr-results

      - name: Кадры базы из кеша
        id: cache
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare'
        uses: actions/cache/restore@v4
        with:
          path: vr-frames
          key: ${{ steps.base.outputs.key }}
          restore-keys: ${{ steps.base.outputs.restore }}

      # 🔴 Обе стороны сравнения снимаются одним образом: шрифты на
      # ubuntu-раннере и в alpine-образе отрисовываются по-разному, и кадр,
      # снятый мимо образа, не совпадёт ни с чем — красный VR стал бы фоновым
      # шумом, каким три дня был красный пайплайн (ADR-167).
      - name: Дев-образ
        if: steps.scope.outputs.pixels == 'true'
        run: docker build --target dev -t tulaklimat-dev:ci .

      # 🔴 Витрина под снимки — статическая сборка, а не дев-сервер (ADR-231).
      # `storybook dev` был общим однопоточным ресурсом на четыре браузера:
      # каждый переход на историю тянул сотни несобранных модулей через
      # трансформ Vite, и четыре потока (ADR-222) дали 1,87× вместо 4×.
      # Собранную витрину раздаёт `caddy` — образ, который уже стоит в составе
      # разработки, новых зависимостей это не добавляет. `--test` не собирает
      # документацию и карты кода: снимкам нужны только истории.
      - name: Сборка витрины
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker run --name "$VR_NET-storybook-build" \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web build-storybook --test --quiet
          docker cp "$VR_NET-storybook-build":/app/apps/web/storybook-static ./storybook-static

      # 🔴 Промах кеша — штатный путь, а не ошибка: кеш живёт неделю без
      # обращений и общий только с `main`. База выкладывается рабочей копией и
      # собирается тем же образом; её кадры снимает раннер HEAD — различаться
      # между сторонами должна витрина, а не код, который её снимает.
      - name: Витрина базы
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare' && steps.cache.outputs.cache-matched-key == ''
        run: |
          git worktree add ../vr-base "${{ steps.base.outputs.base }}"
          docker build --target dev -t tulaklimat-dev:base ../vr-base
          docker run --name "$VR_NET-base-build" \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:base pnpm --filter web build-storybook --test --quiet
          docker cp "$VR_NET-base-build":/app/apps/web/storybook-static ./storybook-base

      # Код возврата здесь не показателен: с `--update-snapshots` Playwright
      # сообщает о записанных кадрах ненулевым кодом. Отказы сценариев базы
      # читает сводка из её итогов — и только предупреждает: чужая поломка не
      # красит этот PR. Индекс историй базы ложится рядом с кадрами — по нему
      # раннер отличает новые истории, которым сравниваться не с чем. База
      # снимается той же долей `VR_SHARD`, что и ветка: раннер делит истории
      # устойчивым хешем id, и доля не зависит от состава историй.
      - name: Кадры базы
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare' && steps.cache.outputs.cache-matched-key == ''
        env:
          VR_CHANGED: ${{ steps.scope.outputs.changed }}
        run: |
          docker network create "$VR_NET-base"
          docker run -d --name "$VR_NET-base-storybook" --network "$VR_NET-base" --network-alias storybook \
            -v "$PWD/storybook-base:/srv:ro" \
            caddy:2.8-alpine caddy file-server --root /srv --listen :6006

          docker run --rm --network "$VR_NET-base" tulaklimat-dev:ci node -e "
            (async () => {
              for (let i = 0; i < 30; i += 1) {
                try {
                  const r = await fetch('http://storybook:6006/index.json');
                  if (r.ok) { console.log('витрина базы готова'); return; }
                } catch {}
                await new Promise((done) => setTimeout(done, 1000));
              }
              console.error('витрина базы не поднялась за полминуты');
              process.exit(1);
            })()"

          docker run --name "$VR_NET-base-run" --network "$VR_NET-base" \
            -v "$PWD/vr-frames:/vr/frames" -v "$PWD/vr-outcome-base:/vr/outcome" \
            -e VR_FRAMES_DIR=/vr/frames -e VR_OUTCOME_DIR=/vr/outcome \
            -e VR_SHARD=${{ matrix.shard }}/4 -e VR_CHANGED \
            -e VR_BASE_URL=http://storybook:6006 -e CI=true -e VR_WORKERS=4 \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web "$VR_SCRIPT" --update-snapshots || true
          cp storybook-base/index.json vr-frames/index.json
          docker rm -f "$VR_NET-base-storybook"

      # 🔴 Кадры базы уходят в кеш ДО сравнения. Там, где эталона не нашлось,
      # Playwright дописывает кадр ветки в тот же каталог — и он выдал бы себя
      # за кадр базы при следующем прогоне.
      - name: Кадры базы в кеш
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare' && steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: vr-frames
          key: ${{ steps.base.outputs.key }}

      - name: Витрина под снимки
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker network create "$VR_NET"
          docker run -d --name "$VR_NET-storybook" --network "$VR_NET" --network-alias storybook \
            -v "$PWD/storybook-static:/srv:ro" \
            caddy:2.8-alpine caddy file-server --root /srv --listen :6006

          # Готовность — по индексу историй. Статика отдаёт его сразу, но
          # проверка остаётся: контейнер мог не подняться вовсе
          docker run --rm --network "$VR_NET" tulaklimat-dev:ci node -e "
            (async () => {
              for (let i = 0; i < 30; i += 1) {
                try {
                  const r = await fetch('http://storybook:6006/index.json');
                  if (r.ok) { console.log('витрина готова'); return; }
                } catch {}
                await new Promise((done) => setTimeout(done, 1000));
              }
              console.error('витрина не поднялась за полминуты');
              process.exit(1);
            })()"

      # `main`: только запись. Кадры и индекс историй уходят в кеш под ключом
      # этого коммита и доли — следующий PR возьмёт их без пересъёмки базы.
      # Красит здесь только отказ сценария или отсутствие итога — их читает
      # сводная работа.
      - name: Запись кадров
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'record'
        run: |
          docker run --name "$VR_NET-run" --network "$VR_NET" \
            -v "$PWD/vr-frames:/vr/frames" -v "$PWD/vr-outcome:/vr/outcome" \
            -e VR_FRAMES_DIR=/vr/frames -e VR_OUTCOME_DIR=/vr/outcome \
            -e VR_SHARD=${{ matrix.shard }}/4 \
            -e VR_BASE_URL=http://storybook:6006 -e CI=true -e VR_WORKERS=4 \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web "$VR_SCRIPT" --update-snapshots || true
          cp storybook-static/index.json vr-frames/index.json

      - name: Кадры main в кеш
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'record'
        uses: actions/cache/save@v4
        with:
          path: vr-frames
          key: ${{ steps.base.outputs.key }}

      # 🔴 Шаг работу не роняет: вердикт по кадрам выносит сводная работа — ей
      # нужны итоги всех шардов разом. Истории, которых в базе нет, раннер
      # снимает без сравнения — по индексу базы (`VR_BASE_INDEX`). Переменные
      # раннеру передаются явно: `docker run` окружения шага не наследует
      # (ADR-222).
      - name: Сравнение кадров
        id: shots
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare'
        continue-on-error: true
        env:
          VR_CHANGED: ${{ steps.scope.outputs.changed }}
        run: |
          docker run --name "$VR_NET-run" --network "$VR_NET" \
            -v "$PWD/vr-frames:/vr/frames" -v "$PWD/vr-outcome:/vr/outcome" \
            -e VR_FRAMES_DIR=/vr/frames -e VR_BASE_INDEX=/vr/frames/index.json \
            -e VR_OUTCOME_DIR=/vr/outcome \
            -e VR_SHARD=${{ matrix.shard }}/4 -e VR_CHANGED -e VR_DUPLICATES=1 \
            -e VR_BASE_URL=http://storybook:6006 -e CI=true -e VR_WORKERS=4 \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web "$VR_SCRIPT"

      # Исход раннера — маркером рядом с итогами: сводной работе он нужен,
      # чтобы отличить «раннер упал, а итог этого не объясняет» от чистого
      # прогона. Регексп сводки читает только `outcome-*.json`, маркер ей не
      # мешает.
      - name: Маркер исхода раннера
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare' }}
        run: echo "${{ steps.shots.outcome }}" > "vr-outcome/runner-s${{ matrix.shard }}"

      # Картинки разницы забираются копией, а не монтированием: Playwright
      # перед прогоном сносит каталог результатов целиком, а точку монтирования
      # изнутри контейнера снести нельзя.
      - name: Расхождения снимков
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare' }}
        run: docker cp "$VR_NET-run":/app/apps/web/test-results/. ./vr-results/ || true

      # Итоги — сводной работе. Выгружаются и при красном шарде: сводка обязана
      # видеть всё, что раннер успел записать.
      - name: Итоги — сводной работе
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vr-outcome-${{ env.VR_PROJECT }}-${{ matrix.shard }}
          path: vr-outcome
          retention-days: 7

      - name: Итоги базы — сводной работе
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' && hashFiles('vr-outcome-base/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vr-outcome-base-${{ env.VR_PROJECT }}-${{ matrix.shard }}
          path: vr-outcome-base
          retention-days: 7

      # Разницу видно только глазами: без картинок «кадр разошёлся» не говорит,
      # уехала кнопка на пиксель или пропал целый блок. Артефакт выгружается,
      # когда есть что смотреть, — и при красной сводке тоже.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' && hashFiles('vr-results/**') != '' }}
        with:
          name: ${{ env.VR_ARTIFACT }}-s${{ matrix.shard }}
          path: vr-results
          retention-days: 7

      - name: Журнал витрины
        if: failure() && steps.scope.outputs.pixels == 'true'
        run: docker logs "$VR_NET-storybook" | tail -50

      # 🔴 Работа, у которой шлюз не отработал, обязана краснеть, а не молчать.
      # Пропущенные шаги дают зелёный вердикт: так `e2e` однажды отчитался
      # успехом, не запустив ни одного сценария. Проверка стоит без условия и
      # ловит именно этот случай — «снимков нет, и причина неизвестна».
      - name: Вердикт работы
        run: |
          case "${{ steps.scope.outputs.pixels }}" in
            true)  echo "Пиксели задеты — доля снята, вердикт выносит сводная работа." ;;
            false) echo "Пиксели не задеты — снимки пропущены осознанно." ;;
            *)     echo "::error::Шлюз не отработал: снимки не сняты, причина неизвестна."
                   exit 1 ;;
          esac

  # 🔴 Сводный вердикт по кадрам public. Имя `vr` — обязательная проверка
  # защиты `main`, и оно не меняется: шарды пришли и ушли бы из требуемых
  # проверок только правкой защиты руками. `if: !cancelled()` обязателен:
  # без него красный шард пропускает сводку, а пропущенная обязательная
  # проверка блокирует merge молча — и наоборот, зелёная сводка обязана
  # состояться только после всех шардов.
  vr:
    runs-on: ubuntu-latest
    needs: vr-shard
    if: ${{ !cancelled() }}

    env:
      # 🔴 Всё, чем эта работа отличается от соседней, — здесь; шаги одинаковы
      # текстом (см. комментарий у шардов).
      VR_PROJECT: public
      VR_ARTIFACT: vr-diff-s1…s4
      # итогов раннеров со всех шардов: 4 шарда × 4 ширины × 2 темы
      VR_EXPECTED: '32'

    steps:
      # Глубина два: сводке нужен первый родитель merge-коммита — база
      # сравнения для заголовка, — и `scripts/vr-summary.mjs` из чекаута.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 🔴 Снимки не переснимаются там, где пиксели измениться не могли
      # (ADR-221). После включения защиты `main` работу ждёт каждый PR —
      # включая правку одной строки в документации. Проверка при этом остаётся
      # обязательной: работа не пропускается, а заканчивается за секунды с
      # зелёным вердиктом.
      #
      # Список путей — то, что физически способно сдвинуть кадр или вердикт:
      # исходники, настройка витрины, сам раннер, сводка, зависимости, образ и
      # этот файл. Всё остальное — документация, задания выкладки, журналы —
      # кадр не двигает.
      - name: Затрагивает ли правка пиксели
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Не pull request — снимаем всё."
            echo "pixels=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          if printf '%s\n' "$changed" | grep -qE '^(apps/web/src/|apps/web/\.storybook/|apps/web/e2e/vr/|apps/web/playwright\.vr\.config\.ts|apps/web/package\.json|pnpm-lock\.yaml|Dockerfile|scripts/vr-summary\.mjs|\.github/workflows/ci\.yml)'; then
            echo "pixels=true" >> "$GITHUB_OUTPUT"
          else
            echo "pixels=false" >> "$GITHUB_OUTPUT"
            echo "Пиксели не задеты, снимки пропускаются. Изменено:"
            printf '  %s\n' $changed
          fi

      - name: База сравнения
        id: base
        if: steps.scope.outputs.pixels == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mode=compare
            base=$(git rev-parse HEAD^1)
          else
            mode=record
            base=${{ github.sha }}
          fi
          {
            echo "mode=$mode"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
          echo "Режим: $mode, база: $base"

      # Отсутствие части артефактов — не ошибка шага, а факт для сводки:
      # итогов меньше ожидаемого она красит сама и называет число. Итоги базы
      # есть только у шардов, снимавших базу в работе, — при попадании в кеш их
      # нет, и это норма.
      - name: Итоги шардов
        if: steps.scope.outputs.pixels == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: vr-outcome-${{ env.VR_PROJECT }}-*
          merge-multiple: true
          path: vr-outcome

      - name: Итоги базы
        if: steps.scope.outputs.pixels == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: vr-outcome-base-${{ env.VR_PROJECT }}-*
          merge-multiple: true
          path: vr-outcome-base

      # Флаг раннера для сводки: красный, если упал хоть один шард как работа
      # или хоть один раннер внутри шарда (маркер `runner-s*`). `join(needs.*)`
      # вместо имени работы — шаги сводных работ одинаковы текстом, различия
      # только в `env` (см. комментарий там).
      - name: Флаг раннера
        id: runner
        if: steps.scope.outputs.pixels == 'true'
        run: |
          flag=success
          [ "${{ join(needs.*.result, '') }}" = "success" ] || flag=failure
          if grep -qs failure vr-outcome/runner-s*; then flag=failure; fi
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          echo "Шарды: ${{ join(needs.*.result, '') }}, раннеры: $flag"

      # 🔴 Шлюз — ярлык `vr:accepted` на PR: задуманное изменение внешнего вида
      # автор принимает явным действием, и оно остаётся видно в PR (ADR-230).
      # Ярлык действует только на разошедшиеся кадры: отказ сценария, падение
      # раннера или шарда и отсутствие итога красят работу всегда. Кадры базы
      # «из кеша», когда база не снималась ни в одном шарде: итоги базы пишет
      # только пересъёмка.
      - name: Сводка и вердикт снимков
        if: steps.scope.outputs.pixels == 'true'
        env:
          VR_ACCEPTED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'vr:accepted') }}
        run: |
          if [ -n "$(ls -A vr-outcome-base 2>/dev/null)" ]; then cache=miss; else cache=hit; fi
          node scripts/vr-summary.mjs \
            --project "$VR_PROJECT" --mode "${{ steps.base.outputs.mode }}" \
            --base "${{ steps.base.outputs.base }}" \
            --cache "$cache" \
            --outcome vr-outcome --base-outcome vr-outcome-base \
            --expected "$VR_EXPECTED" --accepted "$VR_ACCEPTED" \
            --runner "${{ steps.runner.outputs.flag }}" --artifact "$VR_ARTIFACT"

      # 🔴 Работа, у которой шлюз не отработал, обязана краснеть, а не молчать.
      # Пропущенные шаги дают зелёный вердикт: так `e2e` однажды отчитался
      # успехом, не запустив ни одного сценария. Проверка стоит без условия и
      # ловит именно этот случай — «снимков нет, и причина неизвестна».
      - name: Вердикт работы
        run: |
          case "${{ steps.scope.outputs.pixels }}" in
            true)  echo "Пиксели задеты — вердикт вынесла сводка по итогам шардов." ;;
            false) echo "Пиксели не задеты — снимки пропущены осознанно." ;;
            *)     echo "::error::Шлюз не отработал: снимки не сняты, причина неизвестна."
                   exit 1 ;;
          esac

  # 🔴 Панель снимается своими работами, а не разделами в работах public
  # (issue #404).
  #
  # Ширины у неё свои: оболочка переключается по порогам 900 и 1200 и живёт на
  # 390 / 768 / 1440, а высоты контролов растут по кадру ниже 900 (ADR-183).
  # На публичных 375 и 1200 не проверяется ни телефонная раскладка, ни
  # десктопная, ни граница 900.
  #
  # Объём назван числом, а не прикинут: 302 истории × 3 ширины × 2 темы =
  # 1812 кадров. Своими работами они идут параллельно публичным, и общее время
  # пайплайна не растёт.
  #
  # Снимается кит, а не разделы: истории кита несут свои данные в файле, а
  # разделы `Админка/` рисуются из БД и без фикстур меняются от её содержимого.
  vr-panel-shard:
    runs-on: ubuntu-latest

    # 🔴 Упавший шард не отменяет соседние: сводному вердикту нужны итоги всех
    # долей — иначе «итогов меньше ожидаемого» прячет настоящую причину.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      # Значения только для проверки: истории данных из базы не читают, но
      # схема окружения обязана сойтись — её тянут импорты компонентов
      DATABASE_URL: postgresql://tk:ci@127.0.0.1:5432/tulaklimat?schema=public
      SITE_URL: https://ci.invalid
      SESSION_SECRET: ci-secret-not-used-anywhere
      NEXT_TELEMETRY_DISABLED: '1'
      # 🔴 Всё, чем эта работа отличается от соседней, — здесь. Шаги ниже у
      # шардов public и panel одинаковы текстом, и расхождение между работами
      # видно диффом, а не вычитыванием: две копии одной последовательности в
      # проекте уже разъезжались (комментарий в e2e/vr/story-ready.ts).
      VR_PROJECT: panel
      VR_SCRIPT: vr:panel
      VR_NET: vr-panel
      VR_ARTIFACT: vr-panel-diff

    steps:
      # Глубина два: второй коммит — первый родитель merge-коммита PR, то есть
      # вершина `main`, в которую он вливается. Это и есть база сравнения.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 🔴 Снимки не переснимаются там, где пиксели измениться не могли
      # (ADR-221). После включения защиты `main` работу ждёт каждый PR —
      # включая правку одной строки в документации. Проверка при этом остаётся
      # обязательной: работа не пропускается, а заканчивается за секунды с
      # зелёным вердиктом.
      #
      # Список путей — то, что физически способно сдвинуть кадр или вердикт:
      # исходники, настройка витрины, сам раннер, сводка, зависимости, образ и
      # этот файл. Всё остальное — документация, задания выкладки, журналы —
      # кадр не двигает.
      - name: Затрагивает ли правка пиксели
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Не pull request — снимаем всё."
            echo "pixels=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          if printf '%s\n' "$changed" | grep -qE '^(apps/web/src/|apps/web/\.storybook/|apps/web/e2e/vr/|apps/web/playwright\.vr\.config\.ts|apps/web/package\.json|pnpm-lock\.yaml|Dockerfile|scripts/vr-summary\.mjs|\.github/workflows/ci\.yml)'; then
            echo "pixels=true" >> "$GITHUB_OUTPUT"
          else
            echo "pixels=false" >> "$GITHUB_OUTPUT"
            echo "Пиксели не задеты, снимки пропускаются. Изменено:"
            printf '  %s\n' $changed
          fi

          # Список изменённых файлов — раннеру (#444): он снимает только истории,
          # до которых правка дотягивается по графу импортов. Многострочный выход
          # — через ограничитель, иначе первая же вторая строка ломает файл выходов.
          {
            echo "changed<<VR_CHANGED_EOF"
            printf '%s\n' "$changed"
            echo "VR_CHANGED_EOF"
          } >> "$GITHUB_OUTPUT"

      # 🔴 Эталон кадра — кадр базы сравнения, снятый в этой же работе тем же
      # образом и тем же раннером (ADR-230). В репозитории эталонов нет. На PR
      # база — вершина `main`, в которую он вливается: первый родитель
      # merge-коммита, а не `pull_request.base.sha` — тот снят в момент события
      # и бывает устаревшим. На `main` сравнивать нечего: работа записывает
      # кадры в кеш для следующих PR.
      #
      # Ключ кеша — доля, база и версия отрисовщика: образ, зависимости,
      # конфигурация и код раннера — то, что меняет кадры при неизменной
      # витрине. Доля в ключе обязательна: у каждого шарда свои кадры, и общий
      # ключ подсунул бы кадры чужой доли. Настройка витрины (`.storybook/`) в
      # ключ не входит намеренно: её правка — настоящее визуальное изменение,
      # оно должно быть видно в сравнении, а не обходить кеш.
      - name: База сравнения
        id: base
        if: steps.scope.outputs.pixels == 'true'
        env:
          VR_CHANGED: ${{ steps.scope.outputs.changed }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mode=compare
            base=$(git rev-parse HEAD^1)
          else
            mode=record
            base=${{ github.sha }}
          fi
          renderer=${{ hashFiles('Dockerfile', 'pnpm-lock.yaml', 'apps/web/playwright.vr.config.ts', 'apps/web/e2e/vr/**/*.ts') }}
          # 🔴 Полный набор кадров и частичный — разные ключи (#444). `main`
          # пишет полный набор (`-full`); PR при промахе снимает базу только для
          # задетых историй и пишет частичный (`-aff-<хеш списка изменённого>`).
          # Выдай частичный за полный — следующий PR с другим списком не нашёл бы
          # кадров базы для своих историй и получил бы ложные «новые». Восстановление
          # в PR: сначала свой частичный, иначе полный с `main` (`restore-keys`).
          stem="vr-frames-$VR_PROJECT-s${{ matrix.shard }}of4-$base-$renderer"
          if [ "$mode" = "record" ]; then
            key="$stem-full"
            restore=""
          else
            aff=$(printf '%s\n' "$VR_CHANGED" | sha1sum | cut -c1-12)
            key="$stem-aff-$aff"
            restore="$stem-full"
          fi
          {
            echo "mode=$mode"
            echo "base=$base"
            echo "key=$key"
            echo "restore=$restore"
          } >> "$GITHUB_OUTPUT"
          echo "Режим: $mode, база: $base, доля: ${{ matrix.shard }}/4, ключ: $key"
          mkdir -p vr-frames vr-outcome vr-results

      - name: Кадры базы из кеша
        id: cache
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare'
        uses: actions/cache/restore@v4
        with:
          path: vr-frames
          key: ${{ steps.base.outputs.key }}
          restore-keys: ${{ steps.base.outputs.restore }}

      # 🔴 Обе стороны сравнения снимаются одним образом: шрифты на
      # ubuntu-раннере и в alpine-образе отрисовываются по-разному, и кадр,
      # снятый мимо образа, не совпадёт ни с чем — красный VR стал бы фоновым
      # шумом, каким три дня был красный пайплайн (ADR-167).
      - name: Дев-образ
        if: steps.scope.outputs.pixels == 'true'
        run: docker build --target dev -t tulaklimat-dev:ci .

      # 🔴 Витрина под снимки — статическая сборка, а не дев-сервер (ADR-231).
      # `storybook dev` был общим однопоточным ресурсом на четыре браузера:
      # каждый переход на историю тянул сотни несобранных модулей через
      # трансформ Vite, и четыре потока (ADR-222) дали 1,87× вместо 4×.
      # Собранную витрину раздаёт `caddy` — образ, который уже стоит в составе
      # разработки, новых зависимостей это не добавляет. `--test` не собирает
      # документацию и карты кода: снимкам нужны только истории.
      - name: Сборка витрины
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker run --name "$VR_NET-storybook-build" \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web build-storybook --test --quiet
          docker cp "$VR_NET-storybook-build":/app/apps/web/storybook-static ./storybook-static

      # 🔴 Промах кеша — штатный путь, а не ошибка: кеш живёт неделю без
      # обращений и общий только с `main`. База выкладывается рабочей копией и
      # собирается тем же образом; её кадры снимает раннер HEAD — различаться
      # между сторонами должна витрина, а не код, который её снимает.
      - name: Витрина базы
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare' && steps.cache.outputs.cache-matched-key == ''
        run: |
          git worktree add ../vr-base "${{ steps.base.outputs.base }}"
          docker build --target dev -t tulaklimat-dev:base ../vr-base
          docker run --name "$VR_NET-base-build" \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:base pnpm --filter web build-storybook --test --quiet
          docker cp "$VR_NET-base-build":/app/apps/web/storybook-static ./storybook-base

      # Код возврата здесь не показателен: с `--update-snapshots` Playwright
      # сообщает о записанных кадрах ненулевым кодом. Отказы сценариев базы
      # читает сводка из её итогов — и только предупреждает: чужая поломка не
      # красит этот PR. Индекс историй базы ложится рядом с кадрами — по нему
      # раннер отличает новые истории, которым сравниваться не с чем. База
      # снимается той же долей `VR_SHARD`, что и ветка: раннер делит истории
      # устойчивым хешем id, и доля не зависит от состава историй.
      - name: Кадры базы
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare' && steps.cache.outputs.cache-matched-key == ''
        env:
          VR_CHANGED: ${{ steps.scope.outputs.changed }}
        run: |
          docker network create "$VR_NET-base"
          docker run -d --name "$VR_NET-base-storybook" --network "$VR_NET-base" --network-alias storybook \
            -v "$PWD/storybook-base:/srv:ro" \
            caddy:2.8-alpine caddy file-server --root /srv --listen :6006

          docker run --rm --network "$VR_NET-base" tulaklimat-dev:ci node -e "
            (async () => {
              for (let i = 0; i < 30; i += 1) {
                try {
                  const r = await fetch('http://storybook:6006/index.json');
                  if (r.ok) { console.log('витрина базы готова'); return; }
                } catch {}
                await new Promise((done) => setTimeout(done, 1000));
              }
              console.error('витрина базы не поднялась за полминуты');
              process.exit(1);
            })()"

          docker run --name "$VR_NET-base-run" --network "$VR_NET-base" \
            -v "$PWD/vr-frames:/vr/frames" -v "$PWD/vr-outcome-base:/vr/outcome" \
            -e VR_FRAMES_DIR=/vr/frames -e VR_OUTCOME_DIR=/vr/outcome \
            -e VR_SHARD=${{ matrix.shard }}/4 -e VR_CHANGED \
            -e VR_BASE_URL=http://storybook:6006 -e CI=true -e VR_WORKERS=4 \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web "$VR_SCRIPT" --update-snapshots || true
          cp storybook-base/index.json vr-frames/index.json
          docker rm -f "$VR_NET-base-storybook"

      # 🔴 Кадры базы уходят в кеш ДО сравнения. Там, где эталона не нашлось,
      # Playwright дописывает кадр ветки в тот же каталог — и он выдал бы себя
      # за кадр базы при следующем прогоне.
      - name: Кадры базы в кеш
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare' && steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: vr-frames
          key: ${{ steps.base.outputs.key }}

      - name: Витрина под снимки
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker network create "$VR_NET"
          docker run -d --name "$VR_NET-storybook" --network "$VR_NET" --network-alias storybook \
            -v "$PWD/storybook-static:/srv:ro" \
            caddy:2.8-alpine caddy file-server --root /srv --listen :6006

          # Готовность — по индексу историй. Статика отдаёт его сразу, но
          # проверка остаётся: контейнер мог не подняться вовсе
          docker run --rm --network "$VR_NET" tulaklimat-dev:ci node -e "
            (async () => {
              for (let i = 0; i < 30; i += 1) {
                try {
                  const r = await fetch('http://storybook:6006/index.json');
                  if (r.ok) { console.log('витрина готова'); return; }
                } catch {}
                await new Promise((done) => setTimeout(done, 1000));
              }
              console.error('витрина не поднялась за полминуты');
              process.exit(1);
            })()"

      # `main`: только запись. Кадры и индекс историй уходят в кеш под ключом
      # этого коммита и доли — следующий PR возьмёт их без пересъёмки базы.
      # Красит здесь только отказ сценария или отсутствие итога — их читает
      # сводная работа.
      - name: Запись кадров
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'record'
        run: |
          docker run --name "$VR_NET-run" --network "$VR_NET" \
            -v "$PWD/vr-frames:/vr/frames" -v "$PWD/vr-outcome:/vr/outcome" \
            -e VR_FRAMES_DIR=/vr/frames -e VR_OUTCOME_DIR=/vr/outcome \
            -e VR_SHARD=${{ matrix.shard }}/4 \
            -e VR_BASE_URL=http://storybook:6006 -e CI=true -e VR_WORKERS=4 \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web "$VR_SCRIPT" --update-snapshots || true
          cp storybook-static/index.json vr-frames/index.json

      - name: Кадры main в кеш
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'record'
        uses: actions/cache/save@v4
        with:
          path: vr-frames
          key: ${{ steps.base.outputs.key }}

      # 🔴 Шаг работу не роняет: вердикт по кадрам выносит сводная работа — ей
      # нужны итоги всех шардов разом. Истории, которых в базе нет, раннер
      # снимает без сравнения — по индексу базы (`VR_BASE_INDEX`). Переменные
      # раннеру передаются явно: `docker run` окружения шага не наследует
      # (ADR-222).
      - name: Сравнение кадров
        id: shots
        if: steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare'
        continue-on-error: true
        env:
          VR_CHANGED: ${{ steps.scope.outputs.changed }}
        run: |
          docker run --name "$VR_NET-run" --network "$VR_NET" \
            -v "$PWD/vr-frames:/vr/frames" -v "$PWD/vr-outcome:/vr/outcome" \
            -e VR_FRAMES_DIR=/vr/frames -e VR_BASE_INDEX=/vr/frames/index.json \
            -e VR_OUTCOME_DIR=/vr/outcome \
            -e VR_SHARD=${{ matrix.shard }}/4 -e VR_CHANGED -e VR_DUPLICATES=1 \
            -e VR_BASE_URL=http://storybook:6006 -e CI=true -e VR_WORKERS=4 \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web "$VR_SCRIPT"

      # Исход раннера — маркером рядом с итогами: сводной работе он нужен,
      # чтобы отличить «раннер упал, а итог этого не объясняет» от чистого
      # прогона. Регексп сводки читает только `outcome-*.json`, маркер ей не
      # мешает.
      - name: Маркер исхода раннера
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare' }}
        run: echo "${{ steps.shots.outcome }}" > "vr-outcome/runner-s${{ matrix.shard }}"

      # Картинки разницы забираются копией, а не монтированием: Playwright
      # перед прогоном сносит каталог результатов целиком, а точку монтирования
      # изнутри контейнера снести нельзя.
      - name: Расхождения снимков
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' && steps.base.outputs.mode == 'compare' }}
        run: docker cp "$VR_NET-run":/app/apps/web/test-results/. ./vr-results/ || true

      # Итоги — сводной работе. Выгружаются и при красном шарде: сводка обязана
      # видеть всё, что раннер успел записать.
      - name: Итоги — сводной работе
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vr-outcome-${{ env.VR_PROJECT }}-${{ matrix.shard }}
          path: vr-outcome
          retention-days: 7

      - name: Итоги базы — сводной работе
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' && hashFiles('vr-outcome-base/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vr-outcome-base-${{ env.VR_PROJECT }}-${{ matrix.shard }}
          path: vr-outcome-base
          retention-days: 7

      # Разницу видно только глазами: без картинок «кадр разошёлся» не говорит,
      # уехала кнопка на пиксель или пропал целый блок. Артефакт выгружается,
      # когда есть что смотреть, — и при красной сводке тоже.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' && hashFiles('vr-results/**') != '' }}
        with:
          name: ${{ env.VR_ARTIFACT }}-s${{ matrix.shard }}
          path: vr-results
          retention-days: 7

      - name: Журнал витрины
        if: failure() && steps.scope.outputs.pixels == 'true'
        run: docker logs "$VR_NET-storybook" | tail -50

      # 🔴 Работа, у которой шлюз не отработал, обязана краснеть, а не молчать.
      # Пропущенные шаги дают зелёный вердикт: так `e2e` однажды отчитался
      # успехом, не запустив ни одного сценария. Проверка стоит без условия и
      # ловит именно этот случай — «снимков нет, и причина неизвестна».
      - name: Вердикт работы
        run: |
          case "${{ steps.scope.outputs.pixels }}" in
            true)  echo "Пиксели задеты — доля снята, вердикт выносит сводная работа." ;;
            false) echo "Пиксели не задеты — снимки пропущены осознанно." ;;
            *)     echo "::error::Шлюз не отработал: снимки не сняты, причина неизвестна."
                   exit 1 ;;
          esac

  # Сводный вердикт по кадрам кита панели — имя `vr-panel` тоже зашито в
  # защиту `main`; устройство то же, что у `vr`.
  vr-panel:
    runs-on: ubuntu-latest
    needs: vr-panel-shard
    if: ${{ !cancelled() }}

    env:
      # 🔴 Всё, чем эта работа отличается от соседней, — здесь; шаги одинаковы
      # текстом (см. комментарий у шардов).
      VR_PROJECT: panel
      VR_ARTIFACT: vr-panel-diff-s1…s4
      # итогов раннеров со всех шардов: 4 шарда × 3 ширины × 2 темы
      VR_EXPECTED: '24'

    steps:
      # Глубина два: сводке нужен первый родитель merge-коммита — база
      # сравнения для заголовка, — и `scripts/vr-summary.mjs` из чекаута.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 🔴 Снимки не переснимаются там, где пиксели измениться не могли
      # (ADR-221). После включения защиты `main` работу ждёт каждый PR —
      # включая правку одной строки в документации. Проверка при этом остаётся
      # обязательной: работа не пропускается, а заканчивается за секунды с
      # зелёным вердиктом.
      #
      # Список путей — то, что физически способно сдвинуть кадр или вердикт:
      # исходники, настройка витрины, сам раннер, сводка, зависимости, образ и
      # этот файл. Всё остальное — документация, задания выкладки, журналы —
      # кадр не двигает.
      - name: Затрагивает ли правка пиксели
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Не pull request — снимаем всё."
            echo "pixels=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          if printf '%s\n' "$changed" | grep -qE '^(apps/web/src/|apps/web/\.storybook/|apps/web/e2e/vr/|apps/web/playwright\.vr\.config\.ts|apps/web/package\.json|pnpm-lock\.yaml|Dockerfile|scripts/vr-summary\.mjs|\.github/workflows/ci\.yml)'; then
            echo "pixels=true" >> "$GITHUB_OUTPUT"
          else
            echo "pixels=false" >> "$GITHUB_OUTPUT"
            echo "Пиксели не задеты, снимки пропускаются. Изменено:"
            printf '  %s\n' $changed
          fi

      - name: База сравнения
        id: base
        if: steps.scope.outputs.pixels == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mode=compare
            base=$(git rev-parse HEAD^1)
          else
            mode=record
            base=${{ github.sha }}
          fi
          {
            echo "mode=$mode"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"
          echo "Режим: $mode, база: $base"

      # Отсутствие части артефактов — не ошибка шага, а факт для сводки:
      # итогов меньше ожидаемого она красит сама и называет число. Итоги базы
      # есть только у шардов, снимавших базу в работе, — при попадании в кеш их
      # нет, и это норма.
      - name: Итоги шардов
        if: steps.scope.outputs.pixels == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: vr-outcome-${{ env.VR_PROJECT }}-*
          merge-multiple: true
          path: vr-outcome

      - name: Итоги базы
        if: steps.scope.outputs.pixels == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: vr-outcome-base-${{ env.VR_PROJECT }}-*
          merge-multiple: true
          path: vr-outcome-base

      # Флаг раннера для сводки: красный, если упал хоть один шард как работа
      # или хоть один раннер внутри шарда (маркер `runner-s*`). `join(needs.*)`
      # вместо имени работы — шаги сводных работ одинаковы текстом, различия
      # только в `env` (см. комментарий там).
      - name: Флаг раннера
        id: runner
        if: steps.scope.outputs.pixels == 'true'
        run: |
          flag=success
          [ "${{ join(needs.*.result, '') }}" = "success" ] || flag=failure
          if grep -qs failure vr-outcome/runner-s*; then flag=failure; fi
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          echo "Шарды: ${{ join(needs.*.result, '') }}, раннеры: $flag"

      # 🔴 Шлюз — ярлык `vr:accepted` на PR: задуманное изменение внешнего вида
      # автор принимает явным действием, и оно остаётся видно в PR (ADR-230).
      # Ярлык действует только на разошедшиеся кадры: отказ сценария, падение
      # раннера или шарда и отсутствие итога красят работу всегда. Кадры базы
      # «из кеша», когда база не снималась ни в одном шарде: итоги базы пишет
      # только пересъёмка.
      - name: Сводка и вердикт снимков
        if: steps.scope.outputs.pixels == 'true'
        env:
          VR_ACCEPTED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'vr:accepted') }}
        run: |
          if [ -n "$(ls -A vr-outcome-base 2>/dev/null)" ]; then cache=miss; else cache=hit; fi
          node scripts/vr-summary.mjs \
            --project "$VR_PROJECT" --mode "${{ steps.base.outputs.mode }}" \
            --base "${{ steps.base.outputs.base }}" \
            --cache "$cache" \
            --outcome vr-outcome --base-outcome vr-outcome-base \
            --expected "$VR_EXPECTED" --accepted "$VR_ACCEPTED" \
            --runner "${{ steps.runner.outputs.flag }}" --artifact "$VR_ARTIFACT"

      # 🔴 Работа, у которой шлюз не отработал, обязана краснеть, а не молчать.
      # Пропущенные шаги дают зелёный вердикт: так `e2e` однажды отчитался
      # успехом, не запустив ни одного сценария. Проверка стоит без условия и
      # ловит именно этот случай — «снимков нет, и причина неизвестна».
      - name: Вердикт работы
        run: |
          case "${{ steps.scope.outputs.pixels }}" in
            true)  echo "Пиксели задеты — вердикт вынесла сводка по итогам шардов." ;;
            false) echo "Пиксели не задеты — снимки пропущены осознанно." ;;
            *)     echo "::error::Шлюз не отработал: снимки не сняты, причина неизвестна."
                   exit 1 ;;
          esac

  # 🔴 Инварианты без эталона (ADR-230, фаза 3 плана снимков, issue #455).
  #
  # Правила, верные для любой истории — документ не переполнен, цель не меньше
  # порога, тема совпадает с запрошенной, текст не обрезан, поверх цели никто
  # не лежит, шрифты и картинки загрузились, — проверяются на ВСЕХ историях,
  # включая 382 истории `Админка/`, которым пиксельная регрессия недоступна: те
  # рисуются из данных, и кадр меняется вместе с базой (ADR-207), а инвариантам
  # данные безразличны. Эталона нет — нет ни кеша, ни базы, ни ярлыка принятия:
  # нарушение либо чинится, либо допускается параметром истории с причиной, и
  # допущение видно в сводке.
  #
  # Шарды — по образцу снимков: около 5600 загрузок историй одним куском шли бы
  # дольше самого пайплайна. Каждый шард выгружает итоги артефактом, вердикт
  # выносит сводная работа `invariants`.
  #
  # 🔴 В обязательные проверки защиты `main` работа `invariants` пока НЕ входит:
  # первый прогон по 734 историям даст список нарушений, и решение, что чинить,
  # а что допускать, — за владельцем после разбора (issue #457). До него работа
  # красная по праву, но merge не блокирует.
  invariants-shard:
    runs-on: ubuntu-latest

    # Упавший шард не отменяет соседние: сводному вердикту нужны итоги всех
    # долей — иначе «итогов меньше ожидаемого» прячет настоящую причину.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      # Значения только для проверки: истории данных из базы не читают, но
      # схема окружения обязана сойтись — её тянут импорты компонентов
      DATABASE_URL: postgresql://tk:ci@127.0.0.1:5432/tulaklimat?schema=public
      SITE_URL: https://ci.invalid
      SESSION_SECRET: ci-secret-not-used-anywhere
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      # 🔴 Инварианты не меряются там, где пиксели измениться не могли
      # (ADR-221): список путей тот же, что у снимков, плюс сводка инвариантов.
      # Работа не пропускается, а заканчивается за секунды зелёной.
      - name: Затрагивает ли правка пиксели
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Не pull request — меряем всё."
            echo "pixels=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          if printf '%s\n' "$changed" | grep -qE '^(apps/web/src/|apps/web/\.storybook/|apps/web/e2e/vr/|apps/web/playwright\.vr\.config\.ts|apps/web/package\.json|pnpm-lock\.yaml|Dockerfile|scripts/invariants-summary\.mjs|\.github/workflows/ci\.yml)'; then
            echo "pixels=true" >> "$GITHUB_OUTPUT"
          else
            echo "pixels=false" >> "$GITHUB_OUTPUT"
            echo "Пиксели не задеты, инварианты пропускаются. Изменено:"
            printf '  %s\n' $changed
          fi

      # Тот же образ, что у снимков: шрифты и браузер в нём те же, что видит
      # пиксельная регрессия, — иначе размер цели и перенос текста здесь и там
      # разошлись бы.
      - name: Дев-образ
        if: steps.scope.outputs.pixels == 'true'
        run: docker build --target dev -t tulaklimat-dev:ci .

      # Витрина статикой, как у снимков (ADR-231); `--test` не собирает
      # документацию — инвариантам нужны только истории.
      - name: Сборка витрины
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker run --name inv-storybook-build \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web build-storybook --test --quiet
          docker cp inv-storybook-build:/app/apps/web/storybook-static ./storybook-static

      - name: Витрина под замер
        if: steps.scope.outputs.pixels == 'true'
        run: |
          docker network create inv
          docker run -d --name inv-storybook --network inv --network-alias storybook \
            -v "$PWD/storybook-static:/srv:ro" \
            caddy:2.8-alpine caddy file-server --root /srv --listen :6006

          # Готовность — по индексу историй: контейнер мог не подняться вовсе
          docker run --rm --network inv tulaklimat-dev:ci node -e "
            (async () => {
              for (let i = 0; i < 30; i += 1) {
                try {
                  const r = await fetch('http://storybook:6006/index.json');
                  if (r.ok) { console.log('витрина готова'); return; }
                } catch {}
                await new Promise((done) => setTimeout(done, 1000));
              }
              console.error('витрина не поднялась за полминуты');
              process.exit(1);
            })()"

      # 🔴 Шаг работу не роняет: вердикт выносит сводная работа — ей нужны
      # итоги всех шардов разом. Доля историй — `VR_SHARD`, как у снимков:
      # раннер делит истории устойчивым хешем id. Переменные раннеру передаются
      # явно: `docker run` окружения шага не наследует (ADR-222).
      - name: Инварианты историй
        id: run
        if: steps.scope.outputs.pixels == 'true'
        continue-on-error: true
        run: |
          mkdir -p vr-outcome
          docker run --name inv-run --network inv \
            -v "$PWD/vr-outcome:/vr/outcome" \
            -e VR_OUTCOME_DIR=/vr/outcome \
            -e VR_SHARD=${{ matrix.shard }}/4 \
            -e VR_BASE_URL=http://storybook:6006 -e CI=true -e VR_WORKERS=4 \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web vr:invariants

      # 🔴 Правило, которое ни разу не падало, не доказано (issue #456).
      # Истории-фикстуры с нарочными нарушениями обязаны краснеть по каждому
      # правилу — и этот шаг роняет работу сам, без сводки и ярлыков: если
      # правило перестало ловить свою фикстуру, оно не ловит и настоящие
      # нарушения. Фикстур мало, поэтому самотест идёт одним шардом.
      - name: Самотест правил на фикстурах
        if: steps.scope.outputs.pixels == 'true' && matrix.shard == 1
        run: |
          docker run --name inv-fixtures --network inv \
            -e VR_BASE_URL=http://storybook:6006 -e CI=true -e VR_WORKERS=2 \
            -e DATABASE_URL -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web vr:invariants:fixtures

      # Исход раннера — маркером рядом с итогами: сводной работе он нужен,
      # чтобы отличить «раннер упал, а итог этого не объясняет» от чистого
      # прогона. Сводка читает только `invariants-*.json`, маркер ей не мешает.
      - name: Маркер исхода раннера
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' }}
        run: echo "${{ steps.run.outcome }}" > "vr-outcome/runner-s${{ matrix.shard }}"

      # Итоги — сводной работе. Выгружаются и при красном шарде: сводка обязана
      # видеть всё, что раннер успел записать.
      - name: Итоги — сводной работе
        if: ${{ !cancelled() && steps.scope.outputs.pixels == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: invariants-outcome-${{ matrix.shard }}
          path: vr-outcome
          retention-days: 7

      - name: Журнал витрины
        if: failure() && steps.scope.outputs.pixels == 'true'
        run: docker logs inv-storybook | tail -50

      # 🔴 Работа, у которой шлюз не отработал, обязана краснеть, а не молчать
      # (ADR-221): пропущенные шаги дают зелёный вердикт, и «замеров нет,
      # причина неизвестна» иначе проходит за успех.
      - name: Вердикт работы
        run: |
          case "${{ steps.scope.outputs.pixels }}" in
            true)  echo "Пиксели задеты — доля замерена, вердикт выносит сводная работа." ;;
            false) echo "Пиксели не задеты — инварианты пропущены осознанно." ;;
            *)     echo "::error::Шлюз не отработал: замеров нет, причина неизвестна."
                   exit 1 ;;
          esac

  # 🔴 Сводный вердикт по инвариантам. `if: !cancelled()` обязателен: без него
  # красный шард пропускает сводку, и причина красного остаётся в журнале шарда,
  # а не в сводке, ради которой всё и затевалось.
  invariants:
    runs-on: ubuntu-latest
    needs: invariants-shard
    if: ${{ !cancelled() }}

    env:
      # итогов раннеров со всех шардов: 4 шарда × (public 4 ширины × 2 темы +
      # panel 3 ширины × 2 темы) = 4 × 14
      INV_EXPECTED: '56'

    steps:
      # Чекаут — ради `scripts/invariants-summary.mjs`.
      - uses: actions/checkout@v4

      - name: Затрагивает ли правка пиксели
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Не pull request — меряем всё."
            echo "pixels=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          if printf '%s\n' "$changed" | grep -qE '^(apps/web/src/|apps/web/\.storybook/|apps/web/e2e/vr/|apps/web/playwright\.vr\.config\.ts|apps/web/package\.json|pnpm-lock\.yaml|Dockerfile|scripts/invariants-summary\.mjs|\.github/workflows/ci\.yml)'; then
            echo "pixels=true" >> "$GITHUB_OUTPUT"
          else
            echo "pixels=false" >> "$GITHUB_OUTPUT"
            echo "Пиксели не задеты, инварианты пропускаются. Изменено:"
            printf '  %s\n' $changed
          fi

      # Отсутствие части артефактов — не ошибка шага, а факт для сводки:
      # итогов меньше ожидаемого она красит сама и называет число.
      - name: Итоги шардов
        if: steps.scope.outputs.pixels == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: invariants-outcome-*
          merge-multiple: true
          path: vr-outcome

      # Флаг раннера для сводки: красный, если упал хоть один шард как работа
      # или хоть один раннер внутри шарда (маркер `runner-s*`).
      - name: Флаг раннера
        id: runner
        if: steps.scope.outputs.pixels == 'true'
        run: |
          flag=success
          [ "${{ join(needs.*.result, '') }}" = "success" ] || flag=failure
          if grep -qs failure vr-outcome/runner-s*; then flag=failure; fi
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          echo "Шарды: ${{ join(needs.*.result, '') }}, раннеры: $flag"

      # Эталона и ярлыка у инвариантов нет: нарушение красит, пока не починено
      # или не допущено параметром истории с причиной. Допущенное сводка
      # перечисляет — выключенная молча проверка хуже отсутствующей.
      - name: Сводка и вердикт инвариантов
        if: steps.scope.outputs.pixels == 'true'
        run: |
          node scripts/invariants-summary.mjs \
            --outcome vr-outcome --expected "$INV_EXPECTED" \
            --runner "${{ steps.runner.outputs.flag }}"

      # 🔴 Работа, у которой шлюз не отработал, обязана краснеть, а не молчать
      # (ADR-221).
      - name: Вердикт работы
        run: |
          case "${{ steps.scope.outputs.pixels }}" in
            true)  echo "Пиксели задеты — вердикт вынесла сводка по итогам шардов." ;;
            false) echo "Пиксели не задеты — инварианты пропущены осознанно." ;;
            *)     echo "::error::Шлюз не отработал: замеров нет, причина неизвестна."
                   exit 1 ;;
          esac

  # 🔴 Сквозные сценарии — три из них перечислены в CLAUDE.md как обязательные:
  # заявка доходит до базы, отзыв доезжает до модерации, правка цены видна на
  # сайте. До этой работы их не гонял никто: 971 строка сценариев лежала в
  # репозитории и не запускалась ни разу за прогон.
  #
  # Полторы минуты на оба профиля — это шаг, а не повод для отдельной долгой
  # работы. Но идёт он в дев-образе, а не на голом раннере: там уже стоит
  # системный chromium и задан CHROMIUM_PATH (ADR-021), а ставить браузеры
  # заново — минуты на каждый прогон.
  e2e:
    runs-on: ubuntu-latest

    env:
      # 🔴 Адрес тот же, по которому сценарии стучатся в приложение: из него
      # собираются канонические ссылки и карта сайта, и расхождение дало бы
      # падение не по делу. Схема http сознательно: на ней cookie сессии идёт
      # без флага Secure, иначе браузер её выбросит и вход не сработает
      # (ADR-102).
      SITE_URL: http://web:3000
      SESSION_SECRET: ci-secret-not-used-anywhere
      NEXT_TELEMETRY_DISABLED: '1'
      ADMIN_LOGIN: admin

    steps:
      - uses: actions/checkout@v4

      - name: Дев-образ
        run: docker build --target dev -t tulaklimat-dev:ci .

      - name: База под сценарии
        run: |
          docker network create e2e
          docker run -d --name e2e-db --network e2e --network-alias db \
            -e POSTGRES_USER=tk -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=tulaklimat \
            postgres:16-alpine

          # готовность — по pg_isready, а не по паузе: контейнер слушает порт
          # раньше, чем база принимает подключения
          for i in $(seq 1 60); do
            docker exec e2e-db pg_isready -U tk -d tulaklimat >/dev/null 2>&1 && break
            sleep 2
          done

      # 🔴 Сид обязателен, и это не украшение. Без него в базе нет ни
      # администратора, ни ставок допработ, ни группы настроек `legal` — три
      # сценария из пяти падают на первом же шаге. Хеш пароля считается здесь, а
      # не лежит в файле: пароль тестовый, но хешу в репозитории не место.
      - name: Схема и наполнение
        run: |
          # каталог приложения: пакет argon2 живёт в apps/web/node_modules,
          # из корня воркспейса он не разрешается
          hash=$(docker run --rm -w /app/apps/web tulaklimat-dev:ci \
            node -e "require('@node-rs/argon2').hash('admin').then((h) => process.stdout.write(h))")

          docker run --rm --network e2e -e DATABASE_URL="$DB_URL" \
            -e SITE_URL -e SESSION_SECRET tulaklimat-dev:ci \
            pnpm --filter web exec prisma migrate deploy

          docker run --rm --network e2e -e DATABASE_URL="$DB_URL" \
            -e SITE_URL -e SESSION_SECRET -e ADMIN_LOGIN \
            -e ADMIN_PASSWORD_HASH="$hash" tulaklimat-dev:ci \
            pnpm --filter web seed

          # 🔴 Демо-сид обязателен, и порядок тот же, что в DEPLOY §2. Базовый
          # сид оставляет настройки компании заполненными заглушками, а при
          # незаполненных настройках публичная часть отдаёт `noindex` и карта
          # сайта пуста (ADR-153) — сценарий «карта содержит существующие
          # адреса» падал на пустом `<urlset>`. Предохранитель демо-сида на
          # хост `db` не срабатывает: он считает боевыми только внешние адреса.
          docker run --rm --network e2e -e DATABASE_URL="$DB_URL" \
            -e SITE_URL -e SESSION_SECRET tulaklimat-dev:ci \
            pnpm --filter web seed:demo
        env:
          DB_URL: postgresql://tk:ci@db:5432/tulaklimat?schema=public

      - name: Приложение под сценарии
        run: |
          docker run -d --name e2e-web --network e2e --network-alias web \
            -e DATABASE_URL="$DB_URL" -e SITE_URL -e SESSION_SECRET \
            tulaklimat-dev:ci pnpm --filter web dev

          # готовность — по ответу самой страницы: порт слушается раньше, чем
          # Next соберёт первую страницу, и первый же сценарий упал бы на пустом
          docker exec e2e-web node -e "
            (async () => {
              for (let i = 0; i < 90; i += 1) {
                try {
                  const r = await fetch('http://localhost:3000/');
                  if (r.ok) { console.log('приложение готово'); return; }
                } catch {}
                await new Promise((done) => setTimeout(done, 2000));
              }
              console.error('приложение не поднялось за три минуты');
              process.exit(1);
            })()"
        env:
          DB_URL: postgresql://tk:ci@db:5432/tulaklimat?schema=public

      - name: Сквозные сценарии
        run: |
          docker run --name e2e-run --network e2e \
            -e DATABASE_URL="$DB_URL" -e SITE_URL -e SESSION_SECRET \
            -e E2E_BASE_URL=http://web:3000 \
            -e E2E_ADMIN_LOGIN=admin -e E2E_ADMIN_PASSWORD=admin \
            -e CI=1 tulaklimat-dev:ci pnpm --filter web e2e
        env:
          DB_URL: postgresql://tk:ci@db:5432/tulaklimat?schema=public

      # Трассы Playwright уже пишутся при первом ретрае: без них «сценарий
      # упал» не говорит, на каком шаге и что было на экране
      - name: Трассы упавших сценариев
        if: failure()
        run: docker cp e2e-run:/app/apps/web/test-results ./e2e-results || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-trace
          path: e2e-results
          retention-days: 7

      - name: Журнал приложения
        if: failure()
        run: docker logs e2e-web | tail -80
