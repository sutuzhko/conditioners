# Дев-окружение повторяет боевой состав. Запуск на хосте не поддерживается —
# см. docs/DEPLOY.md §2 и ADR-017.
name: conditioner-dev

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8-alpine}
    depends_on: [web]
    ports:
      # 🔴 Только петля. В базе стенда — настоящие данные владельца, а вход в
      # панель здесь admin/admin: на машине в сети это открытая панель с
      # персональными данными. Доступ снаружи — туннелем, см. docs/DEPLOY.md §2.
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      # общие заголовки безопасности обоих окружений
      - ./Caddyfile.headers:/etc/caddy/Caddyfile.headers:ro
      - caddy_data:/data
      - caddy_config:/config

  web:
    build:
      context: .
      target: dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    env_file: .env.dev
    environment:
      # store живёт в томе: см. комментарий в .npmrc
      PNPM_STORE_DIR: /pnpm/store
    depends_on:
      db:
        condition: service_healthy
    ports:
      # запасной вход в обход Caddy — тоже только с этой машины
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      # node_modules — именованные тома: бинарники, собранные под macOS,
      # не должны попадать в linux-контейнер
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - pnpm_store:/pnpm/store
      - next_cache:/app/apps/web/.next
      - uploads:/data/uploads
    command: pnpm --filter web dev

  worker:
    build:
      context: .
      target: dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    env_file: .env.dev
    environment:
      PNPM_STORE_DIR: /pnpm/store
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - pnpm_store:/pnpm/store
      - uploads:/data/uploads
    command: pnpm --filter web worker

  storybook:
    build:
      context: .
      target: dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    env_file: .env.dev
    environment:
      PNPM_STORE_DIR: /pnpm/store
    ports:
      - '127.0.0.1:6006:6006'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - pnpm_store:/pnpm/store
    command: pnpm --filter web storybook

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-tulaklimat}
    ports:
      # только петля, как в проде: порт нужен psql и GUI-клиентам с этой же
      # машины, а пароль базы в деве — `devpass`
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tk} -d ${POSTGRES_DB:-tulaklimat}']
      interval: 5s
      timeout: 5s
      retries: 10

  # 🔴 База под сквозные сценарии — отдельная, со своим томом.
  #
  # Сценарии заводят заявки, отзывы и наряды и убирают за собой сами, но
  # уборка — это код, который тоже может отказать. В дев-базе лежат настоящие
  # обращения владельца, и цена одной ошибки уборки там — потерянная заявка,
  # то есть деньги. Вторая база стоит 43 МБ.
  #
  # Профиль `test` держит её выключенной по умолчанию: обычному `up` она не
  # нужна, а машина, ради которой заведён ADR-173, считает каждый контейнер.
  # Поднимает её `pnpm e2e:stand`, он же накатывает схему и сиды.
  db-test:
    profiles: [test]
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-tulaklimat}
    ports:
      # 5433, а не 5432: обе базы живут одновременно, и порт — единственное,
      # чем они различаются снаружи. Спутать их адреса — это ровно тот случай,
      # ради которого вторая база и заводится
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tk} -d ${POSTGRES_DB:-tulaklimat}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  pgdata_test:
  node_modules:
  web_node_modules:
  pnpm_store:
  next_cache:
  uploads:
  caddy_data:
  caddy_config:
